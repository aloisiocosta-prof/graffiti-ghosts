name: CI / DevSecOps

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit subjects
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            subjects=$(git log --format=%s "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")
          else
            subjects=$(git log --format=%s --no-merges -n 10)
          fi
          pattern='^(feat|fix|refactor|test|docs|chore|build|ci|perf|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            echo "Checking: $subject"
            [[ "$subject" =~ $pattern ]] || { echo "Invalid Conventional Commit: $subject"; exit 1; }
          done <<< "$subjects"

  flutter-quality:
    name: Flutter Analyze and TDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,web .
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CodeQL is intentionally omitted from this Dart-only MVP because the
  # supported CodeQL languages do not include Dart. Re-enable it when a
  # supported source language is added; secret scanning and dependency review
  # remain mandatory below.
  build-web-wasm:
    name: Build Web Wasm
    runs-on: ubuntu-latest
    needs: [flutter-quality, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,web .
      - run: flutter pub get
      - run: flutter build web --wasm --release
      - uses: actions/upload-artifact@v4
        with:
          name: graffiti-ghosts-web-wasm
          path: build/web

  web-wasm-performance:
    name: Web/Wasm Performance and Bundle Audit
    runs-on: ubuntu-latest
    needs: [build-web-wasm]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: graffiti-ghosts-web-wasm
          path: build/web
      - name: Run Web/Wasm performance suite
        id: performance
        run: ./tool/performance/run_web_wasm_suite.sh build/web performance/reports
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-wasm-performance-${{ github.event.pull_request.number }}
          path: performance/reports
          if-no-files-found: warn
      - name: Comment PR with performance summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: performance/reports/performance-summary.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = process.env.SUMMARY_PATH;
            const summary = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'Performance suite did not produce a summary. Inspect the workflow logs and uploaded artifacts.';
            const marker = '<!-- graffiti-ghosts-web-wasm-performance -->';
            const body = `${marker}\n${summary}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [flutter-quality, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,web .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: graffiti-ghosts-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
