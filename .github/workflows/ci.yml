name: CI / DevSecOps

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit subjects
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            subjects=$(git log --format=%s "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")
          else
            subjects=$(git log --format=%s -n 10)
          fi
          pattern='^(feat|fix|refactor|test|docs|chore|build|ci|perf|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            echo "Checking: $subject"
            [[ "$subject" =~ $pattern ]] || { echo "Invalid Conventional Commit: $subject"; exit 1; }
          done <<< "$subjects"

  flutter-quality:
    name: Flutter Analyze and TDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,web .
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3

  build-web-wasm:
    name: Build Web Wasm
    runs-on: ubuntu-latest
    needs: [flutter-quality, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,web .
      - run: flutter pub get
      - run: flutter build web --wasm --release
      - uses: actions/upload-artifact@v4
        with:
          name: graffiti-ghosts-web-wasm
          path: build/web

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [flutter-quality, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,web .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: graffiti-ghosts-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
