name: Release MVP

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,web .
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --wasm --release
      - run: flutter build apk --release
      - name: Archive Web/Wasm
        run: tar -czf graffiti-ghosts-web-wasm-${GITHUB_REF_NAME}.tar.gz -C build web
      - name: Copy Android artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk graffiti-ghosts-android-${GITHUB_REF_NAME}.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            graffiti-ghosts-android-${{ github.ref_name }}.apk
            graffiti-ghosts-web-wasm-${{ github.ref_name }}.tar.gz
