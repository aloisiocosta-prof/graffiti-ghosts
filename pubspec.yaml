name: graffiti_ghosts
description: A stealth platformer MVP for Android and Web/Wasm.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - visual_assets/

# Graffiti Ghosts deliberately uses only Dart and Flutter SDK packages in the MVP.
